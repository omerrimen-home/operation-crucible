schema_version: 1

name: ubuntu-server-01

# These are Crucible logical IDs, not filenames.
profile: ubuntu-26.04-server
image_id: ubuntu-26.04-server

resources:
  cpus: 2
  memory_mb: 2048
  disk_gb: 20

network:
  management:
    enabled: true
    slot: 1

start:
  enabled: true

  # False for now so VirtualBox opens the installer console.
  # Once Ubuntu autoinstall is wired in, this can become true.
  headless: false
