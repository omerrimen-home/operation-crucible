schema_version: 1

id: ubuntu-26.04-desktop
display_name: Ubuntu 26.04 LTS Desktop

image_id: ubuntu-26.04-desktop

os:
  family: linux
  distribution: ubuntu
  version: "26.04"
  flavor: desktop
  architecture: amd64

installer:
  backend: ubuntu-autoinstall
  template_directory: installers/linux/ubuntu/templates
  bootstrap_script: installers/linux/common/bootstrap.sh
  source_id: ubuntu-desktop

defaults:
  cpus: 2
  memory_mb: 4096
  disk_gb: 40

management:
  transport: ssh
  port: 22
  user: crucible
  python_required: true

virtualbox:
  ostype_candidates:
    - Ubuntu_64
    - Ubuntu
    - Linux_64

  firmware: efi
  chipset: piix3
  ioapic: true
  rtc_utc: true
  paravirt_provider: kvm

  graphics:
    controller: vmsvga
    vram_mb: 128

  security:
    tpm: none
    secure_boot: false

  network:
    nic_type: 82540EM

  storage:
    controller_name: SATA Controller
    controller_type: IntelAHCI
    port_count: 4

    disk_port: 0
    installation_iso_port: 1
    bootstrap_iso_port: 2

  boot_order:
    - dvd
    - disk
    - none
    - none
