schema_version: 1

id: windows-server-2022
display_name: Microsoft Windows Server 2022

image_id: windows-server-2022

os:
  family: windows
  distribution: windows-server
  version: "2022"
  architecture: amd64

installer:
  backend: windows-unattend
  template_directory: installers/windows/templates
  answer_file: Autounattend.xml.j2
  bootstrap_script: installers/windows/bootstrap.ps1

  default_image_choice: datacenter-desktop

  image_choices:
    - id: datacenter-desktop
      label: Windows Server 2022 Datacenter (Desktop Experience)
      image_index: 4

    - id: standard-desktop
      label: Windows Server 2022 Standard (Desktop Experience)
      image_index: 2

    - id: datacenter-core
      label: Windows Server 2022 Datacenter (Server Core)
      image_index: 3

    - id: standard-core
      label: Windows Server 2022 Standard (Server Core)
      image_index: 1

  set_administrator_password: true

defaults:
  cpus: 2
  memory_mb: 4096
  disk_gb: 60

management:
  transport: psrp
  protocol: https
  port: 5986
  auth: ntlm
  cert_validation: ignore
  user: crucible
  python_required: false

  readiness:
    port_timeout_seconds: 3600
    connection_timeout_seconds: 900
    bootstrap_timeout_seconds: 6000
    poll_interval_seconds: 5

virtualbox:
  ostype_candidates:
    - Windows2022_64
    - Windows2019_64
    - Windows2016_64
    - Windows_64

  firmware: efi
  chipset: piix3
  ioapic: true
  rtc_utc: false
  paravirt_provider: hyperv

  graphics:
    controller: vboxsvga
    vram_mb: 128
    accelerate_3d: false

  security:
    tpm: none
    secure_boot: false

  network:
    nic_type: 82540EM

  storage:
    controller_name: SATA Controller
    controller_type: IntelAHCI
    port_count: 4

    disk_port: 0
    installation_iso_port: 1
    bootstrap_iso_port: 2

  boot_order:
    - dvd
    - disk
    - none
    - none
