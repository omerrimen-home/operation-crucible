schema_version: 1

id: windows-11
display_name: Microsoft Windows 11

image_id: windows-11

os:
  family: windows
  distribution: windows
  version: "11"
  architecture: amd64

installer:
  backend: windows-unattend
  template_directory: installers/windows/templates
  answer_file: Autounattend.xml.j2
  image_name: "Windows 11 Pro"
  setup_product_key: "W269N-WFGWX-YVC9B-4J6C9-T83GX"
  bootstrap_script: installers/windows/bootstrap.ps1

defaults:
  cpus: 2
  memory_mb: 4096
  disk_gb: 64

requirements:
  min_cpus: 2
  min_memory_mb: 4096
  min_disk_gb: 64
  firmware: efi
  tpm: "2.0"

management:
  transport: psrp
  protocol: https
  port: 5986
  auth: ntlm
  cert_validation: ignore
  user: crucible
  python_required: false

  readiness:
    port_timeout_seconds: 3600
    connection_timeout_seconds: 900
    bootstrap_timeout_seconds: 6000
    poll_interval_seconds: 5

virtualbox:
  ostype_candidates:
    - Windows11_64
    - Windows10_64
    - Windows_64

  firmware: efi
  chipset: piix3
  ioapic: true
  rtc_utc: false
  paravirt_provider: hyperv

  graphics:
    controller: vboxsvga
    vram_mb: 128
    accelerate_3d: false

  security:
    tpm: "2.0"
    secure_boot: true

  network:
    nic_type: 82540EM

  storage:
    controller_name: SATA Controller
    controller_type: IntelAHCI
    port_count: 4

    disk_port: 0
    installation_iso_port: 1
    bootstrap_iso_port: 2

  boot_order:
    - dvd
    - disk
    - none
    - none
