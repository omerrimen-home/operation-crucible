# Operation Crucible hardening control inventory
#
# Source benchmark:
#   CIS Debian Linux 13 Benchmark v1.1.0 (2026-08-26)
#
# Engineering notes:
# - `assessment` is the CIS assessment status from the benchmark.
# - `crucible_implementation` is an Operation Crucible engineering classification.
# - CIS Level 2 extends Level 1. Accordingly, `profiles` contains effective profile
#   membership: a Level 1 Server recommendation is also included in level2-server,
#   and a Level 1 Workstation recommendation is also included in level2-workstation.
# - Exact profile applicability printed by CIS is retained in `source-profile:*` tags.
# - `wave:*` tags are implementation sequencing hints, not CIS metadata.
# - `risk:*` tags describe remediation risk in Crucible's disposable cyber-lab topology,
#   not the security severity or importance of the CIS recommendation.
# - `satisfied_elsewhere` means Crucible intends to satisfy the security objective
#   through an existing Crucible subsystem rather than literal benchmark remediation.
# - `conditional` means remediation must first evaluate machine role, topology,
#   installed services, or lab-use requirements.
# - `audit_only` means Crucible should collect/report evidence but should not make an
#   unconditional remediation change.
#
# Kali compatibility note:
# - The source benchmark targets Debian Linux 13, not Kali Linux Rolling.
# - Crucible uses this benchmark as the closest Debian-family security baseline for
#   Kali. Any Debian-specific assumption must be verified on Kali before a control is
#   considered validated by Crucible.

