# Operation Crucible hardening control inventory
#
# Source benchmark:
#   CIS Microsoft Windows 11 Stand-alone Benchmark
#   v5.0.0 - 2026-03-25
#
# This file stores recommendation metadata only.
#
# The source CIS Benchmark PDF is NOT stored in the Operation
# Crucible repository.
#
# Engineering notes:
#
# - `assessment` preserves the source CIS assessment status.
#
# - `crucible_implementation` describes the current Operation
#   Crucible implementation state.
#
# - Level 2 extends Level 1.
#
# - BitLocker is an optional add-on.
#
# - Windows 11 v5.0.0 has no separate Next Generation profile.
#
# - `source-profile:*` tags preserve source profile membership.
#
# - `wave:*` and `risk:*` are Crucible engineering metadata,
#   not CIS metadata.
#
# - BD-B begins the Windows 10 -> Windows 11 remediation port.
#
# - Exact semantic matches are recorded separately in:
#
#       hardening/ports/windows10-v4-to-windows11-v5.yml
#
# - A semantic match is a porting candidate, not proof that the
#   underlying registry or policy implementation is unchanged.
#
