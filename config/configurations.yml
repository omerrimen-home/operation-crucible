    supported_os:
      - family: linux
        distribution: kali
        version: rolling

    requirements:
      network:
        min_topology_interfaces: 0
        min_static_ipv4_interfaces: 0
        min_internal_network_interfaces: 0
        min_static_internal_interfaces: 0

    relationships:
      requires:
        - nftables

      conflicts: []

    implementation:
      backend: ansible

      playbook: >
        ansible/playbooks/configurations/kali_cis.yml

      order: 950

    parameters:

      profile: auto

      exceptions: []

      implementation_wave: "1"

      banner_text: >-
        Authorized users only. Activity may be
        monitored and reported.

      tmp_size: "25%"

      dev_shm_size: "50%"

      sudo_timestamp_timeout_minutes: 15

      password_max_days: 365

      password_warn_days: 7

      password_inactive_days: 45

      default_umask: "027"

      ssh_client_alive_interval: 15

      ssh_client_alive_count_max: 3

      ssh_login_grace_time: 60

      ssh_max_auth_tries: 4

      ssh_max_sessions: 10

      ssh_max_startups: "10:30:60"

      time_sync_provider: systemd-timesyncd

      time_servers:
        - pool.ntp.org

      # ------------------------------------------------------
      # Wave 2 conditional hardening
      # ------------------------------------------------------

      disable_usb_storage: true

      tmp_noexec: true

      dev_shm_noexec: true

      allow_debugging: false

      enforce_all_apparmor_profiles: false

      disable_xwayland: false

      allow_ipv6_router_advertisements: false

      allow_ssh_forwarding: false

      restrict_su: true

      shell_timeout_seconds: 900

      gdm_idle_delay_seconds: 900

      gdm_lock_delay_seconds: 5

      remote_log_host: ""

      remote_log_protocol: tcp

      remote_log_port: 514

      system_account_shell_exceptions: []

      system_account_lock_exceptions: []

      secure_world_writable_files: false

      # ------------------------------------------------------
      # Wave 3 high-risk hardening
      # ------------------------------------------------------

      pam_faillock_deny: 5

      pam_faillock_unlock_time: 900

      pam_faillock_root_unlock_time: 60

      pam_pwquality_difok: 2

      pam_pwquality_min_length: 14

      pam_pwquality_max_repeat: 3

      pam_pwquality_max_sequence: 3

      pam_pwhistory_remember: 24

      audit_backlog_limit: 8192

      # CIS leaves audit storage sizing to site policy.
      # 64 MiB is a Crucible lab default, not a CIS mandate.
      audit_max_log_file_mb: 64

      audit_space_left_action: syslog

      audit_admin_space_left_action: syslog

    hardening:
      benchmark: cis-debian-linux-13

      profile_parameter: profile

      exceptions_parameter: exceptions

      risk_parameter: implementation_wave

      max_implemented_wave: 3

      validation_mode: inline

    firewall:
      inbound: []
      forward: []

    capabilities: []


  windows-10-cis:

    display_name: CIS Microsoft Windows 10 Stand-alone Hardening

    description: >
      Applies the Operation Crucible implementation of
      the CIS Microsoft Windows 10 Stand-alone Benchmark.
      The benchmark profile controls the security baseline
      and optional BitLocker / Next Generation additions,
      while implementation waves control remediation risk
      and sequencing.

    selectable: true

    supported_os:

      - family: windows
        distribution: windows
        version: "10"

    requirements:

      network:

        min_topology_interfaces: 0

        min_static_ipv4_interfaces: 0

        min_internal_network_interfaces: 0

        min_static_internal_interfaces: 0

    relationships:

      requires: []

      conflicts: []

    implementation:

      backend: ansible

      playbook: >
        ansible/playbooks/configurations/windows_10_cis.yml

      order: 950

    parameters:

      profile: auto

      exceptions: []

      implementation_wave: "1"

      #
      # ------------------------------------------------------
      # General Windows CIS parameters
      # ------------------------------------------------------
      #

      password_history: 24

      password_max_age_days: 365

      password_min_age_days: 1

      password_min_length: 14

      account_lockout_duration_minutes: 15

      account_lockout_threshold: 5

      account_lockout_reset_minutes: 15

      inactivity_timeout_seconds: 900

      legal_notice_title: >-
        Operation Crucible

      legal_notice_text: >-
        Authorized users only. Activity may be
        monitored and reported.

      #
      # ------------------------------------------------------
      # Compatibility-sensitive settings
      # ------------------------------------------------------
      #

      preserve_crucible_winrm: true

      disable_remote_desktop: true

      disable_print_spooler: false

      disable_bluetooth: true

      disable_xbox_services: true

      builtin_administrator_name: CrucibleAdmin

      builtin_guest_name: CrucibleGuest

      password_expiry_warning_days: 14
      
      firewall_log_max_size_kb: 16384

      # Event Log Service
      event_log_application_max_size_kb: 32768
      event_log_security_max_size_kb: 196608
      event_log_setup_max_size_kb: 32768
      event_log_system_max_size_kb: 32768

    hardening:

      benchmark: cis-microsoft-windows-10-standalone

      profile_parameter: profile

      exceptions_parameter: exceptions

      risk_parameter: implementation_wave

      max_implemented_wave: 3

      validation_mode: inline

    firewall:

      inbound: []

      forward: []

    capabilities: []


  windows-11-cis:

    display_name: CIS Microsoft Windows 11 Stand-alone Hardening

    description: >
      Applies the Operation Crucible implementation of
      the CIS Microsoft Windows 11 Stand-alone Benchmark
      v5.0.0. The benchmark profile controls the security
      baseline and optional BitLocker additions, while
      implementation waves control remediation risk and
      sequencing.

    selectable: true

    supported_os:

      - family: windows
        distribution: windows
        version: "11"

    requirements:

      network:

        min_topology_interfaces: 0

        min_static_ipv4_interfaces: 0

        min_internal_network_interfaces: 0

        min_static_internal_interfaces: 0

    relationships:

      requires: []

      conflicts: []

    implementation:

      backend: ansible

      playbook: >
        ansible/playbooks/configurations/windows_11_cis.yml

      order: 950

    parameters:

      profile: auto

      exceptions: []

      implementation_wave: "1"


      # ------------------------------------------------------
      # Account policies
      # ------------------------------------------------------

      password_history: 24

      password_max_age_days: 365

      password_min_age_days: 1

      password_min_length: 14

      account_lockout_duration_minutes: 15

      account_lockout_threshold: 5

      account_lockout_reset_minutes: 15


      # ------------------------------------------------------
      # Compatibility parameters reserved for later BD waves
      # ------------------------------------------------------

      preserve_crucible_winrm: true

      disable_remote_desktop: true

      disable_print_spooler: false

      disable_bluetooth: true

      disable_xbox_services: true

      builtin_administrator_name: CrucibleAdmin

      builtin_guest_name: CrucibleGuest

      inactivity_timeout_seconds: 900

      password_expiry_warning_days: 14

      firewall_log_max_size_kb: 16384

      event_log_application_max_size_kb: 32768

      event_log_security_max_size_kb: 196608

      event_log_setup_max_size_kb: 32768

      event_log_system_max_size_kb: 32768

      legal_notice_title: >-
        Operation Crucible

      legal_notice_text: >-
        Authorized users only. Activity may be
        monitored and reported.

    hardening:

      benchmark: cis-microsoft-windows-11-standalone

      profile_parameter: profile

      exceptions_parameter: exceptions

      risk_parameter: implementation_wave

      max_implemented_wave: 3

      validation_mode: inline

    firewall:

      inbound: []

      forward: []

    capabilities: []


  windows-server-2022-cis:

    display_name: >-
      CIS Microsoft Windows Server 2022 Stand-alone Hardening

    description: >
      Applies the Operation Crucible implementation of
      CIS Microsoft Windows Server 2022 Stand-alone
      Benchmark v2.0.0 for Member Servers. Level 2
      extends Level 1, while Next Generation Windows
      Security is an optional hardware-sensitive add-on.


    # ========================================================
    # BE-A
    #
    # Keep hidden from the Forge until BE-B provides the
    # first complete remediation wave.
    # ========================================================

    selectable: true


    supported_os:

      - family: windows
        distribution: windows-server
        version: "2022"


    requirements:

      network:

        min_topology_interfaces: 0

        min_static_ipv4_interfaces: 0

        min_internal_network_interfaces: 0

        min_static_internal_interfaces: 0


    relationships:

      requires: []

      conflicts: []


    implementation:

      backend: ansible

      playbook: >
        ansible/playbooks/configurations/windows_server_2022_cis.yml

      order: 950


    parameters:


      # ------------------------------------------------------
      # Hardening selection
      # ------------------------------------------------------

      profile: auto

      exceptions: []

      implementation_wave: "1"


      # ------------------------------------------------------
      # Management preservation
      # ------------------------------------------------------

      preserve_crucible_winrm: true


      # ------------------------------------------------------
      # Account policy defaults
      #
      # These are wired now so BE-B does not need to change
      # the public configuration contract.
      # ------------------------------------------------------

      password_history: 24

      password_max_age_days: 365

      password_min_age_days: 1

      password_min_length: 14

      account_lockout_duration_minutes: 15

      account_lockout_threshold: 5

      account_lockout_reset_minutes: 15


      # ------------------------------------------------------
      # Local policy / Security Options defaults
      # ------------------------------------------------------

      builtin_administrator_name: CrucibleAdmin

      builtin_guest_name: CrucibleGuest

      inactivity_timeout_seconds: 900

      password_expiry_warning_days: 14


      legal_notice_title: >-
        Operation Crucible


      legal_notice_text: >-
        Authorized users only. Activity may be
        monitored and reported.


      # ------------------------------------------------------
      # Firewall
      # ------------------------------------------------------

      firewall_log_max_size_kb: 16384


      # ------------------------------------------------------
      # Event Log Service
      # ------------------------------------------------------

      event_log_application_max_size_kb: 32768

      event_log_security_max_size_kb: 196608

      event_log_setup_max_size_kb: 32768

      event_log_system_max_size_kb: 32768

      # ------------------------------------------------------
      # Server-role-aware compatibility
      # ------------------------------------------------------

      preserve_print_server_role: true


    hardening:

      benchmark: >-
        cis-microsoft-windows-server-2022-standalone

      profile_parameter: profile

      exceptions_parameter: exceptions

      risk_parameter: implementation_wave


      # BE-A exposes no remediation.
      #
      # The configuration itself remains selectable:false.
      #
      # The catalog requires this value to be 1, 2, or 3,
      # so Wave 1 is reserved here and activated in BE-B.

      max_implemented_wave: 3

      validation_mode: inline


    firewall:

      inbound: []

      forward: []


    capabilities: []


  active-directory-domain-controller:
    display_name: Active Directory Domain Controller

    description: >
      Promotes Windows Server 2022 into an Active Directory
      Domain Services domain controller.

    selectable: false

    supported_os:
      - family: windows
        distribution: windows-server
        version: "2022"

    requirements:
      network:
        min_topology_interfaces: 1
        min_static_ipv4_interfaces: 1
        min_internal_network_interfaces: 1
        min_static_internal_interfaces: 1

    relationships:
      requires: []
      conflicts: []

    implementation: null

    parameters: {}


  authoritative-dns:
    display_name: Authoritative DNS Server

    description: >
      Configures an authoritative DNS server on a persistent
      Crucible lab network.

    selectable: false

    supported_os:
      - family: linux
        distribution: ubuntu
        version: "26.04"
        flavor: server

      - family: windows
        distribution: windows-server
        version: "2022"

    requirements:
      network:
        min_topology_interfaces: 1
        min_static_ipv4_interfaces: 1
        min_internal_network_interfaces: 1
        min_static_internal_interfaces: 1

    firewall:
      inbound:
        - id: dns-udp
          source_scope: topology
          protocol: udp
          ports:
            - 53
          source_ports: []
          source_addresses: []
          comment: Authoritative DNS UDP

        - id: dns-tcp
          source_scope: topology
          protocol: tcp
          ports:
            - 53
          source_ports: []
          source_addresses: []
          comment: Authoritative DNS TCP

      forward: []

    relationships:
      requires: []
      conflicts: []

    implementation: null

    parameters: {}

    capabilities:
      - service:dns-server


  dhcp-server:
    display_name: DHCP Server

    description: >
      Configures DHCP service for a persistent Crucible
      internal lab network.

    selectable: false

    supported_os:
      - family: linux
        distribution: ubuntu
        version: "26.04"
        flavor: server

      - family: windows
        distribution: windows-server
        version: "2022"

    requirements:
      network:
        min_topology_interfaces: 1
        min_static_ipv4_interfaces: 1
        min_internal_network_interfaces: 1
        min_static_internal_interfaces: 1

    firewall:
      inbound:
        - id: dhcp-server
          source_scope: topology
          protocol: udp
          ports:
            - 67
          source_ports:
            - 68
          source_addresses: []
          comment: DHCP server requests

      forward: []

    relationships:
      requires: []
      conflicts: []

    implementation: null

    parameters: {}

    capabilities:
      - service:dhcp-server