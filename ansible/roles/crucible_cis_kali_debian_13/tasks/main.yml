- name: CIS Kali | Wave 3 PAM hardening
  ansible.builtin.include_tasks:

    file: wave3_pam.yml

  when:

    - crucible_cis_implementation_wave == "3"


- name: CIS Kali | Wave 3 auditd hardening
  ansible.builtin.include_tasks:

    file: wave3_auditd.yml

  when:

    - crucible_cis_implementation_wave == "3"

    - >-
      crucible_cis_wave3_audit_controls
      | default([])
      | length
      > 0


- name: CIS Kali | Wave 3 integrity monitoring
  ansible.builtin.include_tasks:

    file: wave3_aide.yml

  when:

    - crucible_cis_implementation_wave == "3"


- name: CIS Kali | Wave 3 validation
