---

- name: Find world-writable directories without sticky bit
  ansible.builtin.command:

    argv:
      - /usr/bin/find
      - /
      - -xdev
      - -type
      - d
      - -perm
      - -0002
      - "!"
      - -perm
      - -1000
      - -print

  register:
    crucible_cis_world_writable_directories

  changed_when: false

  # GNU find returns rc=1 when individual paths cannot
  # be traversed. Desktop environments commonly expose
  # FUSE-backed paths such as ~/.gvfs and ~/.cache/doc
  # that deliberately reject traversal even during a
  # privileged filesystem audit.
  #
  # The successfully scanned paths remain valid in stdout.
  # Higher return codes still represent a real execution
  # failure and remain fatal.
  failed_when:

    - >-
      crucible_cis_world_writable_directories.rc
      not in
      [
        0,
        1
      ]


- name: Report inaccessible paths during world-writable directory scan
  ansible.builtin.debug:

    msg:
      - >-
        The filesystem scan encountered paths that
        could not be traversed.

      - >-
        This is expected for some desktop/FUSE
        filesystems such as GVFS and document portals.

      - >-
        Inaccessible paths:
        {{
          crucible_cis_world_writable_directories
          .stderr_lines
          | default([])
        }}

  when:

    - >-
      crucible_cis_world_writable_directories.rc
      ==
      1

    - >-
      crucible_cis_world_writable_directories
      .stderr_lines
      | default([])
      | length
      > 0


- name: Add sticky bit to world-writable directories
  ansible.builtin.file:

    path: "{{ item }}"

    mode: "o+t"

  loop: >-
    {{
      crucible_cis_world_writable_directories
      .stdout_lines
    }}


- name: Find world-writable files
  ansible.builtin.command:

    argv:
      - /usr/bin/find
      - /
      - -xdev
      - -type
      - f
      - -perm
      - -0002
      - -print

  register:
    crucible_cis_world_writable_files

  changed_when: false

  failed_when:

    - >-
      crucible_cis_world_writable_files.rc
      not in
      [
        0,
        1
      ]


- name: Report inaccessible paths during world-writable file scan
  ansible.builtin.debug:

    msg:
      - >-
        The filesystem scan encountered paths that
        could not be traversed.

      - >-
        Successfully discovered world-writable files
        remain valid and will continue through the
        configured Crucible remediation policy.

      - >-
        Inaccessible paths:
        {{
          crucible_cis_world_writable_files
          .stderr_lines
          | default([])
        }}

  when:

    - >-
      crucible_cis_world_writable_files.rc
      ==
      1

    - >-
      crucible_cis_world_writable_files
      .stderr_lines
      | default([])
      | length
      > 0


- name: Remove other-write from world-writable files when explicitly enabled
  ansible.builtin.file:

    path: "{{ item }}"

    mode: "o-w"

  loop: >-
    {{
      crucible_cis_world_writable_files
      .stdout_lines
    }}

  when:

    - crucible_cis_secure_world_writable_files | bool


- name: Report world-writable files requiring review
  ansible.builtin.debug:

    msg: >-
      World-writable files were discovered but were
      not automatically modified because arbitrary
      application files may intentionally require
      shared-write semantics:
      {{
        crucible_cis_world_writable_files.stdout_lines
      }}

  when:

    - not crucible_cis_secure_world_writable_files | bool

    - >-
      crucible_cis_world_writable_files.stdout_lines
      | length
      > 0