---

crucible_cis_parameters: >-
  {{
    crucible_current_configuration.parameters
    | default({})
  }}


crucible_cis_implementation_wave: >-
  {{
    crucible_cis_parameters.implementation_wave
    | default('1')
  }}


crucible_cis_banner_text: >-
  {{
    crucible_cis_parameters.banner_text
    | default(
        'Authorized users only. Activity may be monitored and reported.'
      )
  }}


crucible_cis_tmp_size: >-
  {{
    crucible_cis_parameters.tmp_size
    | default('25%')
  }}


crucible_cis_dev_shm_size: >-
  {{
    crucible_cis_parameters.dev_shm_size
    | default('50%')
  }}


crucible_cis_sudo_timestamp_timeout: >-
  {{
    crucible_cis_parameters.sudo_timestamp_timeout_minutes
    | default(15)
  }}


crucible_cis_password_max_days: >-
  {{
    crucible_cis_parameters.password_max_days
    | default(365)
  }}


crucible_cis_password_warn_days: >-
  {{
    crucible_cis_parameters.password_warn_days
    | default(7)
  }}


crucible_cis_password_inactive_days: >-
  {{
    crucible_cis_parameters.password_inactive_days
    | default(45)
  }}


crucible_cis_default_umask: >-
  {{
    crucible_cis_parameters.default_umask
    | default('027')
  }}


crucible_cis_ssh_client_alive_interval: >-
  {{
    crucible_cis_parameters.ssh_client_alive_interval
    | default(15)
  }}


crucible_cis_ssh_client_alive_count_max: >-
  {{
    crucible_cis_parameters.ssh_client_alive_count_max
    | default(3)
  }}


crucible_cis_ssh_login_grace_time: >-
  {{
    crucible_cis_parameters.ssh_login_grace_time
    | default(60)
  }}


crucible_cis_ssh_max_auth_tries: >-
  {{
    crucible_cis_parameters.ssh_max_auth_tries
    | default(4)
  }}


crucible_cis_ssh_max_sessions: >-
  {{
    crucible_cis_parameters.ssh_max_sessions
    | default(10)
  }}


crucible_cis_ssh_max_startups: >-
  {{
    crucible_cis_parameters.ssh_max_startups
    | default('10:30:60')
  }}


crucible_cis_time_sync_provider: >-
  {{
    crucible_cis_parameters.time_sync_provider
    | default('systemd-timesyncd')
  }}


crucible_cis_time_servers: >-
  {{
    crucible_cis_parameters.time_servers
    | default(
        [
          'pool.ntp.org'
        ]
      )
  }}


crucible_cis_disable_usb_storage: >-
  {{
    crucible_cis_parameters.disable_usb_storage
    | default(true)
  }}


crucible_cis_tmp_noexec: >-
  {{
    crucible_cis_parameters.tmp_noexec
    | default(true)
  }}


crucible_cis_dev_shm_noexec: >-
  {{
    crucible_cis_parameters.dev_shm_noexec
    | default(true)
  }}


crucible_cis_allow_debugging: >-
  {{
    crucible_cis_parameters.allow_debugging
    | default(false)
  }}


crucible_cis_enforce_all_apparmor_profiles: >-
  {{
    crucible_cis_parameters.enforce_all_apparmor_profiles
    | default(false)
  }}


crucible_cis_disable_xwayland: >-
  {{
    crucible_cis_parameters.disable_xwayland
    | default(false)
  }}


crucible_cis_allow_ipv6_ra: >-
  {{
    crucible_cis_parameters.allow_ipv6_router_advertisements
    | default(false)
  }}


crucible_cis_allow_ssh_forwarding: >-
  {{
    crucible_cis_parameters.allow_ssh_forwarding
    | default(false)
  }}


crucible_cis_restrict_su: >-
  {{
    crucible_cis_parameters.restrict_su
    | default(true)
  }}


crucible_cis_shell_timeout: >-
  {{
    crucible_cis_parameters.shell_timeout_seconds
    | default(900)
    | int
  }}


crucible_cis_gdm_idle_delay: >-
  {{
    crucible_cis_parameters.gdm_idle_delay_seconds
    | default(900)
    | int
  }}


crucible_cis_gdm_lock_delay: >-
  {{
    crucible_cis_parameters.gdm_lock_delay_seconds
    | default(5)
    | int
  }}


crucible_cis_remote_log_host: >-
  {{
    crucible_cis_parameters.remote_log_host
    | default('')
    | trim
  }}


crucible_cis_remote_log_protocol: >-
  {{
    crucible_cis_parameters.remote_log_protocol
    | default('tcp')
    | lower
  }}


crucible_cis_remote_log_port: >-
  {{
    crucible_cis_parameters.remote_log_port
    | default(514)
    | int
  }}


crucible_cis_system_account_shell_exceptions: >-
  {{
    crucible_cis_parameters.system_account_shell_exceptions
    | default([])
  }}


crucible_cis_system_account_lock_exceptions: >-
  {{
    crucible_cis_parameters.system_account_lock_exceptions
    | default([])
  }}


crucible_cis_secure_world_writable_files: >-
  {{
    crucible_cis_parameters.secure_world_writable_files
    | default(false)
  }}


# ============================================================
# Wave 3
# ============================================================

crucible_cis_pam_faillock_deny: >-
  {{
    crucible_cis_parameters.pam_faillock_deny
    | default(5)
    | int
  }}


crucible_cis_pam_faillock_unlock_time: >-
  {{
    crucible_cis_parameters.pam_faillock_unlock_time
    | default(900)
    | int
  }}


crucible_cis_pam_faillock_root_unlock_time: >-
  {{
    crucible_cis_parameters.pam_faillock_root_unlock_time
    | default(60)
    | int
  }}


crucible_cis_pam_pwquality_difok: >-
  {{
    crucible_cis_parameters.pam_pwquality_difok
    | default(2)
    | int
  }}


crucible_cis_pam_pwquality_min_length: >-
  {{
    crucible_cis_parameters.pam_pwquality_min_length
    | default(14)
    | int
  }}


crucible_cis_pam_pwquality_max_repeat: >-
  {{
    crucible_cis_parameters.pam_pwquality_max_repeat
    | default(3)
    | int
  }}


crucible_cis_pam_pwquality_max_sequence: >-
  {{
    crucible_cis_parameters.pam_pwquality_max_sequence
    | default(3)
    | int
  }}


crucible_cis_pam_pwhistory_remember: >-
  {{
    crucible_cis_parameters.pam_pwhistory_remember
    | default(24)
    | int
  }}


crucible_cis_audit_backlog_limit: >-
  {{
    crucible_cis_parameters.audit_backlog_limit
    | default(8192)
    | int
  }}


crucible_cis_audit_max_log_file_mb: >-
  {{
    crucible_cis_parameters.audit_max_log_file_mb
    | default(64)
    | int
  }}


crucible_cis_audit_space_left_action: >-
  {{
    crucible_cis_parameters.audit_space_left_action
    | default('syslog')
    | lower
  }}


crucible_cis_audit_admin_space_left_action: >-
  {{
    crucible_cis_parameters.audit_admin_space_left_action
    | default('syslog')
    | lower
  }}