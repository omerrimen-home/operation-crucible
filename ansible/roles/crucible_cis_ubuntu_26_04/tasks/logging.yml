---

- name: Install rsyslog
  ansible.builtin.apt:

    name: rsyslog

    state: present


- name: Create journald configuration directory
  ansible.builtin.file:

    path: /etc/systemd/journald.conf.d

    owner: root
    group: root

    mode: "0755"

    state: directory


- name: Configure CIS journald baseline
  ansible.builtin.copy:

    dest: >-
      /etc/systemd/journald.conf.d/
      60-crucible-cis.conf

    owner: root
    group: root

    mode: "0644"

    content: |
      # Managed by Operation Crucible

      [Journal]

      ForwardToSyslog=yes
      Storage=persistent
      Compress=yes

  notify:
    - Restart journald


- name: Configure rsyslog file creation mode
  ansible.builtin.copy:

    dest: >-
      /etc/rsyslog.d/
      20-crucible-cis-permissions.conf

    owner: root
    group: root

    mode: "0644"

    content: |
      # Managed by Operation Crucible

      $FileCreateMode 0640

  notify:
    - Restart rsyslog


- name: Enable rsyslog
  ansible.builtin.systemd_service:

    name: rsyslog

    enabled: true

    state: started


- name: Ensure persistent journal directory exists
  ansible.builtin.file:

    path: /var/log/journal

    owner: root

    group: systemd-journal

    mode: "2755"

    state: directory

#
# ============================================================
# Conditional remote logging receivers
# ============================================================
#

- name: Refresh service facts for logging receiver controls
  ansible.builtin.service_facts:


- name: Stop and mask systemd journal remote receiver
  ansible.builtin.systemd_service:

    name: "{{ item }}"

    state: stopped

    enabled: false

    masked: true

  loop:

    - systemd-journal-remote.service
    - systemd-journal-remote.socket

  when:

    - >-
      '6.1.1.1.2'
      in
      crucible_cis_execution_controls

    - >-
      item
      in
      ansible_facts.services


#
# We deliberately audit rather than blindly rewrite
# arbitrary rsyslog receive configuration.
#

- name: Detect inbound rsyslog receiver configuration
  ansible.builtin.shell: |
    set -o pipefail

    grep -RPE \
      '(^|\s)(module\(load="im(tcp|udp)"|input\(type="im(tcp|udp)"|\$ModLoad\s+im(tcp|udp)|\$Input(TCP|UDP)ServerRun)' \
      /etc/rsyslog.conf \
      /etc/rsyslog.d \
      2>/dev/null

  args:

    executable: /bin/bash

  register:
    crucible_cis_rsyslog_receiver

  changed_when: false

  failed_when: false

  when:

    - >-
      '6.1.2.6'
      in
      crucible_cis_execution_controls


- name: Refuse unexpected inbound rsyslog receiver
  ansible.builtin.assert:

    that:

      - >-
        crucible_cis_rsyslog_receiver.rc
        !=
        0

    fail_msg: >
      Inbound rsyslog receiver configuration was
      detected, but no selected Crucible configuration
      declares logging:rsyslog-receiver. Crucible will
      not automatically delete unknown logging policy.

  when:

    - >-
      '6.1.2.6'
      in
      crucible_cis_execution_controls