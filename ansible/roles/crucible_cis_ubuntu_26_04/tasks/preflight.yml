---

- name: Verify Ubuntu guest
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version("26.04", ">=")

    fail_msg: >
      crucible_cis_ubuntu_26_04 may only run
      against Ubuntu 26.04 guests.


- name: Verify hardening runtime exists
  ansible.builtin.assert:
    that:
      - crucible_hardening is defined
      - crucible_hardening.benchmark.id == "cis-ubuntu-linux-26.04"
      - crucible_hardening.benchmark.version == "1.0.0"

    fail_msg: >
      CIS Ubuntu hardening runtime metadata is
      missing or targets the wrong benchmark.


- name: Verify supported benchmark profile
  ansible.builtin.assert:
    that:
      - >-
        crucible_hardening.profile.id
        in
        [
          'level1-server',
          'level2-server',
          'level1-workstation',
          'level2-workstation'
        ]


- name: Restrict initial implementation to Wave 1
  ansible.builtin.assert:
    that:
      - crucible_cis_implementation_wave == "1"

    fail_msg: >
      The initial Ubuntu CIS Ansible implementation
      currently supports implementation_wave=1 only.


- name: Initialize Wave 1 execution controls
  ansible.builtin.set_fact:

    crucible_cis_execution_controls: []


- name: Initialize Wave 1 control groups
  ansible.builtin.set_fact:

    crucible_cis_wave1_automated_controls: []

    crucible_cis_wave1_conditional_controls: []

    crucible_cis_execution_controls: []


- name: Validate time synchronization provider
  ansible.builtin.assert:

    that:

      - >-
        crucible_cis_time_sync_provider
        in
        [
          'systemd-timesyncd',
          'chrony'
        ]

      - crucible_cis_time_servers is iterable

      - crucible_cis_time_servers is not string

      - crucible_cis_time_servers | length > 0

    fail_msg: >
      time_sync_provider must be either
      systemd-timesyncd or chrony and at least one
      authorized time server must be configured.


- name: Resolve automated Wave 1 controls
  ansible.builtin.set_fact:

    crucible_cis_wave1_automated_controls: >-
      {{
        crucible_cis_wave1_automated_controls
        +
        [
          item
        ]
      }}

  loop: >-
    {{
      crucible_hardening.controls.automated
    }}

  when:
    - >-
      'wave:1'
      in
      crucible_hardening.controls.metadata[item].tags


- name: Resolve conditional Wave 1 controls
  ansible.builtin.set_fact:

    crucible_cis_wave1_conditional_controls: >-
      {{
        crucible_cis_wave1_conditional_controls
        +
        [
          item
        ]
      }}

  loop: >-
    {{
      crucible_hardening.controls.conditional
    }}

  when:
    - >-
      'wave:1'
      in
      crucible_hardening.controls.metadata[item].tags


- name: Build final Wave 1 execution set
  ansible.builtin.set_fact:

    crucible_cis_execution_controls: >-
      {{
        (
          crucible_cis_wave1_automated_controls
          +
          crucible_cis_wave1_conditional_controls
        )
        | unique
        | list
      }}


- name: Display hardening execution summary
  ansible.builtin.debug:

    msg:

      - >-
        Benchmark:
        {{ crucible_hardening.benchmark.display_name }}
        {{ crucible_hardening.benchmark.version }}

      - >-
        Profile:
        {{ crucible_hardening.profile.display_name }}

      - >-
        Machine capabilities:
        {{
          crucible_machine.capabilities
          | default([])
          | join(', ')
          or 'none'
        }}

      - >-
        Applicable controls:
        {{ crucible_hardening.counts.applicable }}

      - >-
        Wave 1 automated controls:
        {{ crucible_cis_wave1_automated_controls | length }}

      - >-
        Wave 1 conditional controls:
        {{ crucible_cis_wave1_conditional_controls | length }}

      - >-
        Wave 1 execution controls:
        {{ crucible_cis_execution_controls | length }}

      - >-
        User exceptions:
        {{
          crucible_hardening.counts.user_exceptions
          | default(0)
        }}

      - >-
        Derived capability exceptions:
        {{
          crucible_hardening.counts.derived_exceptions
          | default(0)
        }}

      - >-
        Audit-only controls:
        {{ crucible_hardening.counts.audit_only }}

      - >-
        Satisfied elsewhere:
        {{ crucible_hardening.counts.satisfied_elsewhere }}


- name: Display derived hardening exceptions
  ansible.builtin.debug:

    var: >-
      crucible_hardening.controls.derived_exception_reasons

  when:
    - >-
      crucible_hardening.controls.derived_exceptions
      | default([])
      | length
      > 0
