---

- name: Flush all hardening handlers
  ansible.builtin.meta:
    flush_handlers


- name: Validate SSH syntax
  ansible.builtin.command:

    argv:
      - /usr/sbin/sshd
      - -t

  changed_when: false


- name: Read effective SSH configuration
  ansible.builtin.command:

    argv:
      - /usr/sbin/sshd
      - -T

  register: crucible_cis_sshd_effective

  changed_when: false


- name: Validate critical SSH settings
  ansible.builtin.assert:

    that:

      - >-
        'permitrootlogin no'
        in
        crucible_cis_sshd_effective.stdout

      - >-
        'permitemptypasswords no'
        in
        crucible_cis_sshd_effective.stdout

      - >-
        'usepam yes'
        in
        crucible_cis_sshd_effective.stdout

      - >-
        'maxauthtries 4'
        in
        crucible_cis_sshd_effective.stdout


- name: Validate AppArmor service
  ansible.builtin.command:

    argv:
      - systemctl
      - is-active
      - apparmor

  changed_when: false


- name: Validate rsyslog service
  ansible.builtin.command:

    argv:
      - systemctl
      - is-active
      - rsyslog

  changed_when: false


- name: Validate nftables alternate firewall provider
  ansible.builtin.command:

    argv:
      - nft
      - list
      - table
      - inet
      - crucible_filter

  register: crucible_cis_nftables

  changed_when: false


# ============================================================
# Time synchronization
# ============================================================

- name: Verify systemd-timesyncd is active
  ansible.builtin.command:

    argv:
      - systemctl
      - is-active
      - systemd-timesyncd.service

  changed_when: false

  when:

    - >-
      crucible_cis_time_sync_provider
      ==
      'systemd-timesyncd'


- name: Verify chrony is active
  ansible.builtin.command:

    argv:
      - systemctl
      - is-active
      - chrony.service

  changed_when: false

  when:

    - >-
      crucible_cis_time_sync_provider
      ==
      'chrony'


- name: Verify chronyd runs as _chrony
  ansible.builtin.command:

    argv:
      - /usr/bin/pgrep
      - -u
      - _chrony
      - chronyd

  changed_when: false

  when:

    - >-
      crucible_cis_time_sync_provider
      ==
      'chrony'


# ============================================================
# Network protocol modules
# ============================================================

- name: Verify disabled network protocol modules cannot load
  ansible.builtin.command:

    argv:
      - /usr/sbin/modprobe
      - -n
      - -v
      - "{{ item.module }}"

  register:
    crucible_cis_module_probe_test

  changed_when: false

  loop: >-
    {{
      crucible_cis_network_protocol_modules
      | default([])
    }}

  when:

    - >-
      item.control
      in
      crucible_cis_execution_controls


- name: Verify network module deny policy
  ansible.builtin.assert:

    that:

      - >-
        '/bin/false'
        in
        item.stdout

    fail_msg: >
      A CIS-disabled network protocol module remains
      loadable.

  loop: >-
    {{
      crucible_cis_module_probe_test.results
      | default([])
    }}

  when:

    - not item.skipped | default(false)


# ============================================================
# Forwarding
# ============================================================

- name: Verify non-router IPv4 forwarding is disabled
  ansible.builtin.command:

    argv:
      - /sbin/sysctl
      - -n
      - net.ipv4.ip_forward

  register:
    crucible_cis_ipv4_forward

  changed_when: false

  when:

    - >-
      '3.3.1.1'
      in
      crucible_cis_execution_controls


- name: Assert non-router IPv4 forwarding is disabled
  ansible.builtin.assert:

    that:

      - >-
        crucible_cis_ipv4_forward.stdout
        | trim
        ==
        '0'

  when:

    - >-
      '3.3.1.1'
      in
      crucible_cis_execution_controls


- name: Verify controller connection after hardening
  ansible.builtin.wait_for_connection:

    timeout: 90


- name: Show partial compliance status
  ansible.builtin.debug:

    msg:
      - >-
        Crucible CIS Ubuntu Wave 1 remediation
        completed successfully.

      - >-
        Benchmark compliance remains unverified
        until per-control audit validation is
        implemented.

      - >-
        Conditional, authentication-sensitive,
        audit, installer-time, and deferred controls
        have not been blindly remediated.