---

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded


- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted


- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted


- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true