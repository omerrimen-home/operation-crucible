---

crucible_cis_windows_11_parameters: >-
  {{
    crucible_current_configuration.parameters
    | default({})
  }}


crucible_cis_windows_11_implementation_wave: >-
  {{
    crucible_cis_windows_11_parameters.implementation_wave
    | default('1')
    | string
  }}


# ============================================================
# Section 1.1 - Password Policy
# ============================================================

crucible_cis_windows_11_password_history: >-
  {{
    crucible_cis_windows_11_parameters.password_history
    | default(24)
    | int
  }}


crucible_cis_windows_11_password_max_age_days: >-
  {{
    crucible_cis_windows_11_parameters.password_max_age_days
    | default(365)
    | int
  }}


crucible_cis_windows_11_password_min_age_days: >-
  {{
    crucible_cis_windows_11_parameters.password_min_age_days
    | default(1)
    | int
  }}


crucible_cis_windows_11_password_min_length: >-
  {{
    crucible_cis_windows_11_parameters.password_min_length
    | default(14)
    | int
  }}


# ============================================================
# Section 1.2 - Account Lockout Policy
# ============================================================

crucible_cis_windows_11_lockout_duration_minutes: >-
  {{
    crucible_cis_windows_11_parameters
    .account_lockout_duration_minutes
    | default(15)
    | int
  }}


crucible_cis_windows_11_lockout_threshold: >-
  {{
    crucible_cis_windows_11_parameters
    .account_lockout_threshold
    | default(5)
    | int
  }}


crucible_cis_windows_11_lockout_reset_minutes: >-
  {{
    crucible_cis_windows_11_parameters
    .account_lockout_reset_minutes
    | default(15)
    | int
  }}


# ============================================================
# BD-C - Security Options
# ============================================================

crucible_cis_windows_11_builtin_administrator_name: >-
  {{
    crucible_cis_windows_11_parameters
    .builtin_administrator_name
    | default('CrucibleAdmin')
    | string
  }}


crucible_cis_windows_11_builtin_guest_name: >-
  {{
    crucible_cis_windows_11_parameters
    .builtin_guest_name
    | default('CrucibleGuest')
    | string
  }}


crucible_cis_windows_11_inactivity_timeout_seconds: >-
  {{
    crucible_cis_windows_11_parameters
    .inactivity_timeout_seconds
    | default(900)
    | int
  }}


crucible_cis_windows_11_password_expiry_warning_days: >-
  {{
    crucible_cis_windows_11_parameters
    .password_expiry_warning_days
    | default(14)
    | int
  }}


crucible_cis_windows_11_legal_notice_title: >-
  {{
    crucible_cis_windows_11_parameters
    .legal_notice_title
    | default('Operation Crucible')
    | string
  }}


crucible_cis_windows_11_legal_notice_text: >-
  {{
    crucible_cis_windows_11_parameters
    .legal_notice_text
    | default(
        'Authorized users only. Activity may be monitored and reported.'
      )
    | string
  }}


# ============================================================
# Profile helpers
# ============================================================

crucible_cis_windows_11_bitlocker_profile_selected: >-
  {{
    crucible_hardening.profile.id
    in
    [
      'bitlocker',
      'level1-bitlocker',
      'level2-bitlocker'
    ]
  }}


# ============================================================
# Windows Defender Firewall
# ============================================================

crucible_cis_windows_11_firewall_log_max_size_kb: >-
  {{
    crucible_cis_windows_11_parameters
    .firewall_log_max_size_kb
    | default(16384)
    | int
  }}


# ============================================================
# State
# ============================================================

crucible_cis_windows_11_state_directory: >-
  C:\ProgramData\Crucible\hardening


crucible_cis_windows_11_evidence_path: >-
  C:\ProgramData\Crucible\hardening\windows-11-cis-evidence.json


crucible_cis_windows_11_completion_path: >-
  C:\ProgramData\Crucible\hardening\windows-11-cis.yml


crucible_cis_windows_11_final_reboot_timeout_seconds: 1200
