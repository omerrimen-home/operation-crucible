---

# ============================================================
# CIS Microsoft Windows 11 Stand-alone Benchmark v5.0.0
# Section 2.3 - Security Options
#
# BD-C completes the Windows 11 Security Options inventory.
#
# Manual:
#
#   2.3.11.5
#
# remains Manual exactly as classified by CIS.
# ============================================================


- name: Load Windows 11 CIS Security Options registry map
  ansible.builtin.include_vars:

    file: >-
      {{
        role_path
      }}/vars/security_options.yml


# ============================================================
# Security-policy-database controls
# ============================================================

- name: Define Windows 11 local-security-policy Security Options
  ansible.builtin.set_fact:

    crucible_cis_windows_11_security_policy_options:

      - control_id: "2.3.1.1"
        section: System Access
        key: EnableGuestAccount
        value: "0"

      - control_id: "2.3.10.1"
        section: System Access
        key: LSAAnonymousNameLookup
        value: "0"


- name: Apply Windows 11 local-security-policy Security Options
  community.windows.win_security_policy:

    section: "{{ item.section }}"

    key: "{{ item.key }}"

    value: "{{ item.value }}"

  loop: >-
    {{
      crucible_cis_windows_11_security_policy_options
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.key }}

  when:

    - >-
      item.control_id
      in
      crucible_cis_windows_11_execution_controls


# ============================================================
# 2.3.1.3 / 2.3.1.4
#
# Rename built-in accounts by RID.
#
# RID 500 = Administrator
# RID 501 = Guest
# ============================================================

- name: Define Windows 11 built-in account rename policies
  ansible.builtin.set_fact:

    crucible_cis_windows_11_builtin_account_renames:

      - control_id: "2.3.1.3"
        rid: 500
        target_name: >-
          {{
            crucible_cis_windows_11_builtin_administrator_name
          }}

      - control_id: "2.3.1.4"
        rid: 501
        target_name: >-
          {{
            crucible_cis_windows_11_builtin_guest_name
          }}


- name: Apply Windows 11 CIS built-in account renames
  ansible.windows.win_powershell:

    parameters:

      Rid: "{{ item.rid }}"

      TargetName: "{{ item.target_name }}"

    script: |
      [CmdletBinding()]
      param (
          [Parameter(Mandatory = $true)]
          [int] $Rid,

          [Parameter(Mandatory = $true)]
          [string] $TargetName
      )

      $Ansible.Changed = $false


      $BuiltinAccount = Get-LocalUser |
          Where-Object {
              $_.SID.Value -match "-$Rid$"
          } |
          Select-Object -First 1


      if ($null -eq $BuiltinAccount) {

          throw (
              "Could not locate built-in local account " +
              "with RID $Rid."
          )
      }


      $ExistingTarget = Get-LocalUser `
          -Name $TargetName `
          -ErrorAction SilentlyContinue


      if (
          $null -ne $ExistingTarget
          -and
          $ExistingTarget.SID.Value
          -ne
          $BuiltinAccount.SID.Value
      ) {

          throw (
              "Cannot rename built-in account " +
              $BuiltinAccount.Name +
              " to '$TargetName': another local account " +
              "already uses that name."
          )
      }


      if (
          $BuiltinAccount.Name
          -cne
          $TargetName
      ) {

          Rename-LocalUser `
              -SID $BuiltinAccount.SID `
              -NewName $TargetName


          $Ansible.Changed = $true
      }


      $UpdatedAccount = Get-LocalUser |
          Where-Object {
              $_.SID.Value -match "-$Rid$"
          } |
          Select-Object -First 1


      $Ansible.Result = @{

          rid = $Rid

          name = (
              $UpdatedAccount.Name
          )

          sid = (
              $UpdatedAccount.SID.Value
          )
      }

  loop: >-
    {{
      crucible_cis_windows_11_builtin_account_renames
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      RID {{ item.rid }}
      ->
      {{ item.target_name }}

  when:

    - >-
      item.control_id
      in
      crucible_cis_windows_11_execution_controls

  register: >-
    crucible_cis_windows_11_account_rename_results


# ============================================================
# Registry-backed Security Options
# ============================================================

- name: Apply Windows 11 CIS registry-backed Security Options
  ansible.builtin.include_tasks:

    file: registry_policy_engine.yml

  vars:

    crucible_windows_registry_policy_batch: >-
      {{
        crucible_cis_windows_11_security_option_registry_policies
      }}


# ============================================================
# Manual recommendation
# ============================================================

- name: Report Windows 11 CIS Manual Security Option
  ansible.builtin.debug:

    msg: >-
      CIS 2.3.11.5 - Network security: Force logoff when
      logon hours expire remains Manual in the source
      Windows 11 v5.0.0 benchmark and is therefore not
      silently promoted to automated remediation.

  when:

    - >-
      '2.3.11.5'
      in
      (
        crucible_hardening.controls.manual
        | default([])
      )