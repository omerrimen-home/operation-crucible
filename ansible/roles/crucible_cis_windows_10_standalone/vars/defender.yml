---

# ============================================================
# CIS Windows 10 v4.0.0
# Microsoft Defender Antivirus Level 1 policies
#
# These are the registry-backed policy values identified by
# the CIS audit procedures.
# ============================================================

crucible_cis_windows_10_defender_registry_policies:


  # ==========================================================
  # Features
  # ==========================================================

  - control_id: "18.10.43.4.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Features'
    name: PassiveRemediation
    type: dword
    data: 1


  # ==========================================================
  # MAPS
  # ==========================================================

  - control_id: "18.10.43.5.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    name: LocalSettingOverrideSpynetReporting
    type: dword
    data: 0


  # ==========================================================
  # Attack Surface Reduction master policy
  # ==========================================================

  - control_id: "18.10.43.6.1.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
    name: ExploitGuard_ASR_Rules
    type: dword
    data: 1


  # ==========================================================
  # Network Protection
  # ==========================================================

  - control_id: "18.10.43.6.3.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
    name: EnableNetworkProtection
    type: dword
    data: 1


  # ==========================================================
  # MpEngine
  # ==========================================================

  - control_id: "18.10.43.7.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    name: EnableFileHashComputation
    type: dword
    data: 1


  # ==========================================================
  # Real-Time Protection
  # ==========================================================

  - control_id: "18.10.43.10.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    name: OobeEnableRtpAndSigUpdate
    type: dword
    data: 1

  - control_id: "18.10.43.10.2"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    name: DisableIOAVProtection
    type: dword
    data: 0

  - control_id: "18.10.43.10.3"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    name: DisableRealtimeMonitoring
    type: dword
    data: 0

  - control_id: "18.10.43.10.4"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    name: DisableBehaviorMonitoring
    type: dword
    data: 0

  - control_id: "18.10.43.10.5"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    name: DisableScriptScanning
    type: dword
    data: 0


  # ==========================================================
  # Behavioral Network Blocks
  #
  # CIS allows Audit or Block. Crucible deliberately selects
  # Audit for this Level 1 lab baseline.
  # ==========================================================

  - control_id: "18.10.43.11.1.1.2"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection'
    name: BruteForceProtectionConfiguredState
    type: dword
    data: 2


  # ==========================================================
  # Scan
  # ==========================================================

  - control_id: "18.10.43.13.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    name: QuickScanIncludeExclusions
    type: dword
    data: 1

  - control_id: "18.10.43.13.2"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    name: DisablePackedExeScanning
    type: dword
    data: 0

  - control_id: "18.10.43.13.3"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    name: DisableRemovableDriveScanning
    type: dword
    data: 0

  - control_id: "18.10.43.13.4"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    name: DaysUntilAggressiveCatchupQuickScan
    type: dword
    data: 7

  - control_id: "18.10.43.13.5"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    name: DisableEmailScanning
    type: dword
    data: 0


  # ==========================================================
  # General Defender
  # ==========================================================

  - control_id: "18.10.43.16"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    name: PUAProtection
    type: dword
    data: 1

  - control_id: "18.10.43.17"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    name: HideExclusionsFromLocalUsers
    type: dword
    data: 1


# ============================================================
# 18.10.43.6.1.2
#
# CIS requires every listed ASR rule to have REG_SZ value "1".
# Keep the GUID inventory separate because one CIS control maps
# to thirteen registry values.
# ============================================================

