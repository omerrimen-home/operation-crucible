---

crucible_cis_windows_10_event_log_registry_policies:

  # ==========================================================
  # Application
  # ==========================================================

  - control_id: "18.10.26.1.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    name: Retention
    type: string
    data: "0"

  - control_id: "18.10.26.1.2"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    name: MaxSize
    type: dword
    data: >-
      {{
        crucible_cis_windows_10_event_log_application_max_size_kb
        | int
      }}


  # ==========================================================
  # Security
  # ==========================================================

  - control_id: "18.10.26.2.1"
