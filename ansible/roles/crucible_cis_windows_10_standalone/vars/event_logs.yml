        | int
      }}


  # ==========================================================
  # System
  # ==========================================================

  - control_id: "18.10.26.4.1"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    name: Retention
    type: string
    data: "0"

  - control_id: "18.10.26.4.2"
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    name: MaxSize
    type: dword
