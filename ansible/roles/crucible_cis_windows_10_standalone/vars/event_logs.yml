    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    name: MaxSize
    type: dword
    data: >-
      {{
        crucible_cis_windows_10_event_log_security_max_size_kb
        | int
      }}


  # ==========================================================
  # Setup
  # ==========================================================

  - control_id: "18.10.26.3.1"
