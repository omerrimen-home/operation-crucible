# ============================================================
# Account rename idempotence
# ============================================================

- name: Verify built-in account renames are converged
  ansible.windows.win_powershell:

    parameters:

      Rid: "{{ item.rid }}"

      TargetName: "{{ item.target_name }}"

    script: |
      [CmdletBinding()]
      param (
          [Parameter(Mandatory = $true)]
          [int] $Rid,

          [Parameter(Mandatory = $true)]
          [string] $TargetName
      )

      $Ansible.Changed = $false

      $Account = Get-LocalUser |
          Where-Object {
              $_.SID.Value -match "-$Rid$"
          } |
          Select-Object -First 1

      if ($null -eq $Account) {
          throw (
              "Could not locate built-in account " +
              "with RID $Rid during validation."
          )
      }

      if (
          $Account.Name -cne
          $TargetName
      ) {
          throw (
              "Built-in account RID $Rid has name '" +
              $Account.Name +
              "' rather than expected name '" +
              $TargetName +
              "'."
          )
      }

      $Ansible.Result = @{
          rid = $Rid
          name = $Account.Name
          sid = $Account.SID.Value
      }

  loop: >-
    {{
      crucible_cis_windows_10_builtin_account_renames
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      RID {{ item.rid }}

  when:
    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls


# ============================================================
# Registry idempotence
# ============================================================

- name: Verify registry-backed Security Options are converged
  ansible.windows.win_regedit:

    path: "{{ item.path }}"

    name: "{{ item.name }}"

    type: "{{ item.type }}"

    data: "{{ item.data }}"

    state: present

  loop: >-
    {{
      crucible_cis_windows_10_security_option_registry_policies
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.name }}

  when:
    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls

  register: >-
    crucible_cis_windows_10_registry_verification


- name: Assert registry-backed Security Options made no changes
  ansible.builtin.assert:

    that:

      - >-
        (
          crucible_cis_windows_10_registry_verification
          .results
          | default([])
          | rejectattr(
              'skipped',
              'defined'
            )
          | selectattr(
              'changed',
              'equalto',
              true
            )
          | list
          | length
        )
        ==
        0

    fail_msg: >-
      One or more registry-backed Windows CIS Security
      Options failed second-pass convergence.


