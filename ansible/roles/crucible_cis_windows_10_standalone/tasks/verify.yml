# ============================================================
# Protect the Forge management plane
# ============================================================

- name: Verify Crucible WinRM service and HTTPS listener
  ansible.windows.win_powershell:

    script: |
      [CmdletBinding()]
      param ()

      $Ansible.Changed = $false


      $Service = Get-Service `
          -Name WinRM `
          -ErrorAction Stop


      $Listener = Get-NetTCPConnection `
          -State Listen `
          -LocalPort 5986 `
          -ErrorAction SilentlyContinue `
          | Select-Object -First 1


      $Ansible.Result = @{
          winrm_status = (
              [string]$Service.Status
          )

          https_5986_listening = (
              $null -ne $Listener
          )
      }

  register: >-
    crucible_cis_windows_10_management_state


- name: Assert Crucible WinRM infrastructure remains available
  ansible.builtin.assert:

    that:

      - >-
        crucible_cis_windows_10_management_state.result
        .winrm_status
        ==
        'Running'

      - >-
        crucible_cis_windows_10_management_state.result
        .https_5986_listening
        | bool

    fail_msg: >-
      Windows CIS hardening left the current Ansible
      connection alive, but Crucible's persistent WinRM
      HTTPS management infrastructure is no longer healthy.

- name: Verify WinRM management survives hardening
  ansible.windows.win_ping:

  register: >-
    crucible_cis_windows_10_management_ping


- name: Assert Windows management connectivity remains available
  ansible.builtin.assert:

    that:
      - >-
        crucible_cis_windows_10_management_ping.ping
        ==
        "pong"

    fail_msg: >-
      Windows CIS hardening completed policy
      remediation but Crucible management
      connectivity did not survive validation.