---

# ============================================================
# BC-C inline verification
#
# Repeat the same desired-state operations.
#
# Because both Windows policy modules are idempotent,
# the second pass MUST report no changes.
#
# We then perform a fresh WinRM/PSRP ping to ensure that
# hardening did not destroy Crucible management access.
# ============================================================


- name: Verify account policies are converged
  community.windows.win_security_policy:

    section: "{{ item.section }}"

    key: "{{ item.key }}"

    value: "{{ item.value }}"

  loop: >-
    {{
      crucible_cis_windows_10_account_policy_settings
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.key }}

  when:
    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls

  register: >-
    crucible_cis_windows_10_account_policy_verification


- name: Verify relaxed password-length policy is converged
  ansible.windows.win_regedit:

    path: >-
      HKLM:\SYSTEM\CurrentControlSet\Control\SAM

    name: RelaxMinimumPasswordLengthLimits

    data: 1

    type: dword

    state: present

  when:
    - >-
      '1.1.6'
      in
      crucible_cis_windows_10_execution_controls

  register: >-
    crucible_cis_windows_10_relaxed_length_verification


- name: Verify user-right assignments are converged
  ansible.windows.win_user_right:

    name: "{{ item.right }}"

    users: "{{ item.users }}"

    action: "{{ item.action }}"

  loop: >-
    {{
      crucible_cis_windows_10_user_right_settings
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.right }}

  when:
    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls

  register: >-
    crucible_cis_windows_10_user_right_verification


# ============================================================
# Assert idempotence
# ============================================================

- name: Assert account-policy verification made no changes
  ansible.builtin.assert:

    that:

      - >-
        (
          crucible_cis_windows_10_account_policy_verification.results
          | default([])
          | rejectattr(
              'skipped',
              'defined'
            )
          | selectattr(
              'changed',
              'equalto',
              true
            )
          | list
          | length
        )
        ==
        0

    fail_msg: >-
      One or more Windows account policies were not
      converged after remediation.


- name: Assert relaxed password-length verification made no changes
  ansible.builtin.assert:

    that:

      - >-
        not
        (
          crucible_cis_windows_10_relaxed_length_verification.changed
          | default(false)
        )

    fail_msg: >-
      RelaxMinimumPasswordLengthLimits was not
      converged after remediation.

  when:
    - >-
      '1.1.6'
      in
      crucible_cis_windows_10_execution_controls


- name: Assert user-right verification made no changes
  ansible.builtin.assert:

    that:

      - >-
        (
          crucible_cis_windows_10_user_right_verification.results
          | default([])
          | rejectattr(
              'skipped',
              'defined'
            )
          | selectattr(
              'changed',
              'equalto',
              true
            )
          | list
          | length
        )
        ==
        0

    fail_msg: >-
      One or more Windows User Rights assignments
      were not converged after remediation.


