---

# ============================================================
# CIS Microsoft Windows 10 Stand-alone
# Section 1 - Account Policies
#
# The majority of these settings are backed by the
# Windows local security policy database and are applied
# through community.windows.win_security_policy.
#
# 1.1.6 is registry-backed and is therefore handled
# separately.
#
# 1.2.3 remains Manual exactly as classified by CIS.
# ============================================================


- name: Define Windows CIS account-policy settings
  ansible.builtin.set_fact:

    crucible_cis_windows_10_account_policy_settings:

      # --------------------------------------------------------
      # 1.1 Password Policy
      # --------------------------------------------------------

      - control_id: "1.1.1"
        section: System Access
        key: PasswordHistorySize
        value: >-
          {{
            crucible_cis_windows_10_password_history
            | string
          }}

      - control_id: "1.1.2"
        section: System Access
        key: MaximumPasswordAge
        value: >-
          {{
            crucible_cis_windows_10_password_max_age_days
            | string
          }}

      - control_id: "1.1.3"
        section: System Access
        key: MinimumPasswordAge
        value: >-
          {{
            crucible_cis_windows_10_password_min_age_days
            | string
          }}

      - control_id: "1.1.4"
        section: System Access
        key: MinimumPasswordLength
        value: >-
          {{
            crucible_cis_windows_10_password_min_length
            | string
          }}

      - control_id: "1.1.5"
        section: System Access
        key: PasswordComplexity
        value: "1"

      - control_id: "1.1.7"
        section: System Access
        key: ClearTextPassword
        value: "0"


      # --------------------------------------------------------
      # 1.2 Account Lockout Policy
      # --------------------------------------------------------

      - control_id: "1.2.1"
        section: System Access
        key: LockoutDuration
        value: >-
          {{
            crucible_cis_windows_10_lockout_duration_minutes
            | string
          }}

      - control_id: "1.2.2"
        section: System Access
        key: LockoutBadCount
        value: >-
          {{
            crucible_cis_windows_10_lockout_threshold
            | string
          }}

      - control_id: "1.2.4"
        section: System Access
        key: ResetLockoutCount
        value: >-
          {{
            crucible_cis_windows_10_lockout_reset_minutes
            | string
          }}


- name: Apply Windows CIS local account policies
  community.windows.win_security_policy:

    section: "{{ item.section }}"

    key: "{{ item.key }}"

    value: "{{ item.value }}"

  loop: >-
    {{
      crucible_cis_windows_10_account_policy_settings
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.key }}

  when:
    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls


# ============================================================
# 1.1.6 Relax minimum password length limits
# ============================================================

- name: CIS 1.1.6 | Enable relaxed minimum password length limits
  ansible.windows.win_regedit:

    path: >-
      HKLM:\SYSTEM\CurrentControlSet\Control\SAM

    name: RelaxMinimumPasswordLengthLimits

    data: 1

    type: dword

    state: present

  when:
    - >-
      '1.1.6'
      in
      crucible_cis_windows_10_execution_controls