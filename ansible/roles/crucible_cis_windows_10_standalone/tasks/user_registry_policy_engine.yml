---

# ============================================================
# Operation Crucible
# Windows all-user registry policy engine
#
# Expected variable:
#
#   crucible_windows_user_registry_policy_batch
#
# Each policy contains:
#
#   control_id
#   subkey
#   name
#   type
#   data
#
# Policies are applied to:
#
#   - every existing normal user profile;
#   - currently loaded user hives;
#   - unloaded user NTUSER.DAT hives;
#   - C:\Users\Default\NTUSER.DAT for future users.
#
# IMPORTANT:
#
# HKU\.DEFAULT is NOT the Default User profile.
# ============================================================


- name: Apply declarative Windows user registry policy
  ansible.windows.win_powershell:

    parameters:

      Subkey: >-
        {{
          item.subkey
        }}

      ValueName: >-
        {{
          item.name
        }}

      ValueType: >-
        {{
          item.type
        }}

      DesiredData: >-
        {{
          item.data
        }}

    script: |
      [CmdletBinding()]
      param (
          [Parameter(Mandatory = $true)]
          [string] $Subkey,

          [Parameter(Mandatory = $true)]
          [string] $ValueName,

          [Parameter(Mandatory = $true)]
          [string] $ValueType,

          [Parameter(Mandatory = $true)]
          [object] $DesiredData
      )


      $Ansible.Changed = $false
      $script:Changed = $false


      # ======================================================
      # Registry type conversion
      # ======================================================

      function Convert-CrucibleRegistryType {

          param (
              [Parameter(Mandatory = $true)]
              [string] $Type
          )


          switch ($Type.ToLowerInvariant()) {

              "dword" {

                  return "DWord"
              }


              "qword" {

                  return "QWord"
              }


              "string" {

                  return "String"
              }


              "expandstring" {

                  return "ExpandString"
              }


              "multistring" {

                  return "MultiString"
              }


              default {

                  throw (
                      "Unsupported Crucible registry " +
                      "type '$Type'."
                  )
              }
          }
      }


      # ======================================================
      # Registry data conversion
      # ======================================================

      function Convert-CrucibleRegistryData {

          param (
              [Parameter(Mandatory = $true)]
              [string] $Type,

              [AllowNull()]
              [object] $Data
          )


          switch ($Type.ToLowerInvariant()) {

              "dword" {

                  return [int]$Data
              }


              "qword" {

                  return [long]$Data
              }


              "multistring" {

                  return @($Data)
              }


              default {

                  return [string]$Data
              }
          }
      }


      # ======================================================
      # Compare current and desired values
      # ======================================================

      function Test-CrucibleRegistryValue {

          param (
              [AllowNull()]
              [object] $Current,

              [AllowNull()]
              [object] $Desired,

              [Parameter(Mandatory = $true)]
              [string] $Type
          )


          if ($Type.ToLowerInvariant() -eq "multistring") {

              $CurrentArray = @($Current)

              $DesiredArray = @($Desired)


              if ($CurrentArray.Count -ne $DesiredArray.Count) {

                  return $false
              }


              for (
                  $Index = 0;
                  $Index -lt $DesiredArray.Count;
                  $Index++
              ) {

                  if (
                      [string]$CurrentArray[$Index] -cne
                      [string]$DesiredArray[$Index]
                  ) {

                      return $false
                  }
              }


              return $true
          }


          return (
              [string]$Current -ceq
              [string]$Desired
          )
      }


      # ======================================================
      # Ensure one registry value exists and is correct
      # ======================================================

      function Set-CrucibleRegistryValue {

          param (
              [Parameter(Mandatory = $true)]
              [string] $KeyPath,

              [Parameter(Mandatory = $true)]
              [string] $Name,

              [Parameter(Mandatory = $true)]
              [string] $Type,

              [AllowNull()]
              [object] $Data
          )


          if (-not (Test-Path -LiteralPath $KeyPath)) {

              New-Item `
                  -Path $KeyPath `
                  -Force |
                  Out-Null


              $script:Changed = $true
          }


          $Desired = Convert-CrucibleRegistryData `
              -Type $Type `
              -Data $Data


          $Existing = $null

          $Exists = $false


          try {

              $Existing = Get-ItemPropertyValue `
                  -LiteralPath $KeyPath `
                  -Name $Name `
                  -ErrorAction Stop


              $Exists = $true
          }

          catch {

              $Exists = $false
          }


          $AlreadyCorrect = $false


          if ($Exists) {

              $AlreadyCorrect = (
                  Test-CrucibleRegistryValue `
                      -Current $Existing `
                      -Desired $Desired `
                      -Type $Type
              )
          }


          if ($AlreadyCorrect) {

              return
          }


          $PowerShellType = Convert-CrucibleRegistryType `
              -Type $Type


          New-ItemProperty `
              -LiteralPath $KeyPath `
              -Name $Name `
              -PropertyType $PowerShellType `
              -Value $Desired `
              -Force |
              Out-Null


          $script:Changed = $true
      }


      # ======================================================
      # Apply one policy beneath one loaded hive
      # ======================================================

      function Apply-ToHive {

          param (
              [Parameter(Mandatory = $true)]
              [string] $HiveRoot,

              [Parameter(Mandatory = $true)]
              [string] $Description
          )


          $KeyPath = (
              "{0}\{1}" -f
              $HiveRoot,
              $Subkey
          )


          Set-CrucibleRegistryValue `
              -KeyPath $KeyPath `
              -Name $ValueName `
              -Type $ValueType `
              -Data $DesiredData


          return @{

              description = (
                  $Description
              )

              key = (
                  $KeyPath
              )
          }
      }


      # ======================================================
      # Apply to every existing normal user profile
      # ======================================================

      $Applied = @()


      $ProfileListPath = (
          "HKLM:\SOFTWARE\Microsoft\Windows NT\" +
          "CurrentVersion\ProfileList"
      )


      $ProfileEntries = @(
          Get-ChildItem `
              -LiteralPath $ProfileListPath `
              -ErrorAction Stop
      )


      foreach ($ProfileEntry in $ProfileEntries) {

          $Sid = (
              [string]$ProfileEntry.PSChildName
          )


          # --------------------------------------------------
          # Normal local/domain user profile SID shape.
          #
          # Skip LocalSystem, NetworkService, LocalService,
          # service profiles, etc.
          # --------------------------------------------------

          if ($Sid -notmatch '^S-1-5-21-') {

              continue
          }


          $ProfileProperties = Get-ItemProperty `
              -LiteralPath $ProfileEntry.PSPath `
              -ErrorAction Stop


          $ProfilePath = (
              [Environment]::ExpandEnvironmentVariables(
                  [string]$ProfileProperties.ProfileImagePath
              )
          )


          $HiveFile = Join-Path `
              $ProfilePath `
              "NTUSER.DAT"


          if (-not (Test-Path -LiteralPath $HiveFile)) {

              continue
          }


          $LoadedHive = (
              "Registry::HKEY_USERS\{0}" -f
              $Sid
          )


          # --------------------------------------------------
          # User hive already loaded.
          # --------------------------------------------------

          if (Test-Path -LiteralPath $LoadedHive) {

              $Applied += Apply-ToHive `
                  -HiveRoot $LoadedHive `
                  -Description $ProfilePath


              continue
          }


          # --------------------------------------------------
          # Existing profile whose hive is not loaded.
          # --------------------------------------------------

          $MountName = (
              "Crucible_{0}" -f
              (
                  $Sid -replace '-', '_'
              )
          )


          $MountRegistryPath = (
              "Registry::HKEY_USERS\{0}" -f
              $MountName
          )


          # --------------------------------------------------
          # Clean up a stale Crucible mount if a prior aborted
          # operation left one behind.
          # --------------------------------------------------

          if (Test-Path -LiteralPath $MountRegistryPath) {

              [GC]::Collect()

              [GC]::WaitForPendingFinalizers()


              & reg.exe `
                  unload `
                  "HKU\$MountName" |
                  Out-Null


              if ($LASTEXITCODE -ne 0) {

                  throw (
                      "Could not unload stale Crucible " +
                      "registry hive HKU\$MountName."
                  )
              }
          }


          & reg.exe `
              load `
              "HKU\$MountName" `
              $HiveFile |
              Out-Null


          if ($LASTEXITCODE -ne 0) {

              throw (
                  "Could not load user registry hive " +
                  "'$HiveFile'."
              )
          }


          try {

              $MountedRoot = (
                  "Registry::HKEY_USERS\{0}" -f
                  $MountName
              )


              $Applied += Apply-ToHive `
                  -HiveRoot $MountedRoot `
                  -Description $ProfilePath
          }

          finally {

              # ------------------------------------------------
              # Release Registry-provider references before
              # reg.exe unload.
              # ------------------------------------------------

              [GC]::Collect()

              [GC]::WaitForPendingFinalizers()


              & reg.exe `
                  unload `
                  "HKU\$MountName" |
                  Out-Null


              if ($LASTEXITCODE -ne 0) {

                  throw (
                      "Could not unload temporary " +
                      "registry hive HKU\$MountName."
                  )
              }
          }
      }


      # ======================================================
      # Default User
      #
      # This template is copied whenever Windows creates a new
      # user profile.
      #
      # It is deliberately NOT HKU\.DEFAULT.
      # ======================================================

      $DefaultHiveFile = Join-Path `
          $env:SystemDrive `
          "Users\Default\NTUSER.DAT"


      if (Test-Path -LiteralPath $DefaultHiveFile) {

          $DefaultMount = (
              "Crucible_Default_User"
          )


          $DefaultMountRegistryPath = (
              "Registry::HKEY_USERS\{0}" -f
              $DefaultMount
          )


          if (
              Test-Path `
                  -LiteralPath $DefaultMountRegistryPath
          ) {

              [GC]::Collect()

              [GC]::WaitForPendingFinalizers()


              & reg.exe `
                  unload `
                  "HKU\$DefaultMount" |
                  Out-Null


              if ($LASTEXITCODE -ne 0) {

                  throw (
                      "Could not unload stale " +
                      "Default User Crucible hive."
                  )
              }
          }


          & reg.exe `
              load `
              "HKU\$DefaultMount" `
              $DefaultHiveFile |
              Out-Null


          if ($LASTEXITCODE -ne 0) {

              throw (
                  "Could not load Default User hive."
              )
          }


          try {

              $DefaultRoot = (
                  "Registry::HKEY_USERS\{0}" -f
                  $DefaultMount
              )


              $Applied += Apply-ToHive `
                  -HiveRoot $DefaultRoot `
                  -Description "Default User"
          }

          finally {

              [GC]::Collect()

              [GC]::WaitForPendingFinalizers()


              & reg.exe `
                  unload `
                  "HKU\$DefaultMount" |
                  Out-Null


              if ($LASTEXITCODE -ne 0) {

                  throw (
                      "Could not unload Default User hive."
                  )
              }
          }
      }


      # ======================================================
      # Ansible result
      # ======================================================

      $Ansible.Changed = (
          [bool]$script:Changed
      )


      $Ansible.Result = @{

          subkey = (
              $Subkey
          )

          value_name = (
              $ValueName
          )

          type = (
              $ValueType
          )

          applied_hives = (
              $Applied
          )

          applied_hive_count = (
              $Applied.Count
          )
      }

  loop: >-
    {{
      crucible_windows_user_registry_policy_batch
    }}

  loop_control:

    label: >-
      {{ item.control_id }}
      {{ item.name }}

  when:

    - >-
      item.control_id
      in
      crucible_cis_windows_10_execution_controls

  register: >-
    crucible_windows_user_registry_policy_results


# ============================================================
# BC-I reboot accounting
# ============================================================

- name: Mark Windows reboot required after user registry policy changes
  ansible.builtin.set_fact:

    crucible_cis_windows_10_reboot_required: true

  when:

    - >-
      (
        crucible_windows_user_registry_policy_results.results
        | default([])
        | rejectattr(
            'skipped',
            'defined'
          )
        | selectattr(
            'changed',
            'equalto',
            true
          )
        | list
        | length
      )
      >
      0