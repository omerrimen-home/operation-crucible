---

# ============================================================
# Operation Crucible
#
# CIS Microsoft Windows Server 2022 Stand-alone
# Benchmark v2.0.0
#
# Member Server baseline
# ============================================================


crucible_cis_windows_server_2022_parameters: >-
  {{
    crucible_current_configuration.parameters
    | default({})
  }}


crucible_cis_windows_server_2022_implementation_wave: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .implementation_wave
    | default('1')
    | string
  }}


# ============================================================
# Management preservation
# ============================================================

crucible_cis_windows_server_2022_preserve_crucible_winrm: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .preserve_crucible_winrm
    | default(true)
    | bool
  }}


# ============================================================
# Section 1.1 - Password Policy
#
# Wired during BE-A; enforcement begins in BE-B.
# ============================================================

crucible_cis_windows_server_2022_password_history: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .password_history
    | default(24)
    | int
  }}


crucible_cis_windows_server_2022_password_max_age_days: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .password_max_age_days
    | default(365)
    | int
  }}


crucible_cis_windows_server_2022_password_min_age_days: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .password_min_age_days
    | default(1)
    | int
  }}


crucible_cis_windows_server_2022_password_min_length: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .password_min_length
    | default(14)
    | int
  }}


# ============================================================
# Section 1.2 - Account Lockout Policy
# ============================================================

crucible_cis_windows_server_2022_lockout_duration_minutes: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .account_lockout_duration_minutes
    | default(15)
    | int
  }}


crucible_cis_windows_server_2022_lockout_threshold: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .account_lockout_threshold
    | default(5)
    | int
  }}


crucible_cis_windows_server_2022_lockout_reset_minutes: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .account_lockout_reset_minutes
    | default(15)
    | int
  }}


# ============================================================
# Local Policy / Security Options
# ============================================================

crucible_cis_windows_server_2022_builtin_administrator_name: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .builtin_administrator_name
    | default('CrucibleAdmin')
    | string
  }}


crucible_cis_windows_server_2022_builtin_guest_name: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .builtin_guest_name
    | default('CrucibleGuest')
    | string
  }}


crucible_cis_windows_server_2022_inactivity_timeout_seconds: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .inactivity_timeout_seconds
    | default(900)
    | int
  }}


crucible_cis_windows_server_2022_password_expiry_warning_days: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .password_expiry_warning_days
    | default(14)
    | int
  }}


crucible_cis_windows_server_2022_legal_notice_title: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .legal_notice_title
    | default('Operation Crucible')
    | string
  }}


crucible_cis_windows_server_2022_legal_notice_text: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .legal_notice_text
    | default(
        'Authorized users only. Activity may be monitored and reported.'
      )
    | string
  }}


# ============================================================
# Windows Defender Firewall
# ============================================================

crucible_cis_windows_server_2022_firewall_log_max_size_kb: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .firewall_log_max_size_kb
    | default(16384)
    | int
  }}


# ============================================================
# Profile helpers
# ============================================================

crucible_cis_windows_server_2022_next_generation_profile_selected: >-
  {{
    crucible_hardening.profile.id
    in
    [
      'next-generation',
      'level1-next-generation',
      'level2-next-generation'
    ]
  }}


# ============================================================
# Server-role preservation
# ============================================================

crucible_cis_windows_server_2022_preserve_print_server_role: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .preserve_print_server_role
    | default(true)
    | bool
  }}


# ============================================================
# BE-F - Final hardening state
# ============================================================

crucible_cis_windows_server_2022_state_directory: >-
  C:\ProgramData\Crucible\hardening


crucible_cis_windows_server_2022_evidence_path: >-
  C:\ProgramData\Crucible\hardening\windows-server-2022-cis-evidence.json


crucible_cis_windows_server_2022_completion_path: >-
  C:\ProgramData\Crucible\hardening\windows-server-2022-cis.yml


# Server workloads can take noticeably longer than desktop
# Windows to return after VBS / Device Guard policy changes.

crucible_cis_windows_server_2022_final_reboot_timeout_seconds: >-
  {{
    crucible_cis_windows_server_2022_parameters
    .final_reboot_timeout_seconds
    | default(1800)
    | int
  }}